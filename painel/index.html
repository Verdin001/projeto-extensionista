<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Central de Monitoramento - TI</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #alertas { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 30px; }
        .card-alerta { 
            background-color: #ff3333; padding: 30px; border-radius: 10px; width: 80%; max-width: 600px;
            box-shadow: 0 0 20px #ff3333; animation: piscar 1s infinite alternate;
        }
        .card-alerta h2 { margin: 0 0 10px 0; font-size: 32px; }
        .btn-atender { 
            margin-top: 20px; padding: 15px 30px; font-size: 18px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 5px; background-color: white; color: #ff3333;
        }
        @keyframes piscar { from { opacity: 1; } to { opacity: 0.7; } }
    </style>
</head>
<body>
    <h1>Painel de Monitoramento</h1>
    <div id="alertas">
        <h3 style="color: #666;">Nenhum alerta pendente.</h3>
    </div>

<script>
    function identificarSetor(nomeMaquina) {
        const nome = nomeMaquina.toLowerCase();
        if (nome.includes("emerg")) return "Emergência";
        if (nome.includes("cc-") || nome.includes("cc")) return "Centro Cirúrgico";
        return "Setor Não Mapeado";
    }

    async function buscarAlertas() {
        try {
            const resposta = await fetch("http://localhost:8080/api/alertas/pendentes");
            const alertas = await resposta.json();
            
            const divAlertas = document.getElementById("alertas");
            divAlertas.innerHTML = ""; 

            if (alertas.length === 0) {
                divAlertas.innerHTML = "<h3 style='color: #666;'>Nenhum alerta pendente.</h3>";
                return;
            }

            alertas.forEach(alerta => {
                const card = document.createElement("div");
                card.className = "card-alerta";
                
                const dataFormatada = new Date(alerta.dataHora).toLocaleTimeString('pt-BR');
                const setor = identificarSetor(alerta.nomeMaquina);

                // O campo <input> foi removido daqui para evitar o bug
                card.innerHTML = `
                    <h2>🚨 OCORRÊNCIA NO LOCAL: ${setor.toUpperCase()}</h2>
                    <p><strong>Máquina:</strong> ${alerta.nomeMaquina.toUpperCase()}</p>
                    <p><strong>Usuário Solicitante:</strong> ${alerta.usuarioAd}</p>
                    <p><strong>Hora do Acionamento:</strong> ${dataFormatada}</p>
                    
                    <div style="margin-top: 25px; display: flex; justify-content: center;">
                        <button class="btn-atender" style="margin-top: 0;" onclick="atenderAlerta(${alerta.id})">ATENDER OCORRÊNCIA</button>
                    </div>
                `;
                divAlertas.appendChild(card);
            });
        } catch (erro) {
            console.error("Erro ao conectar com a API:", erro);
        }
    }

    async function atenderAlerta(id) {
        // O comando 'prompt' abre uma caixa de diálogo nativa do navegador pedindo o nome
        const nomeAgente = prompt("Digite o nome do agente ou segurança que vai atender esta ocorrência:");

        // Validação: se clicar em cancelar (null) ou deixar em branco (""), bloqueia a ação
        if (nomeAgente === null || nomeAgente.trim() === "") {
            alert("Operação cancelada: O nome do atendente é obrigatório!");
            return;
        }

        // Se o nome foi digitado corretamente, envia para a API
        await fetch(`http://localhost:8080/api/alertas/${id}/atender?agente=${encodeURIComponent(nomeAgente)}`, { 
            method: 'PUT' 
        });
        
        buscarAlertas(); 
    }

    setInterval(buscarAlertas, 3000);
    buscarAlertas(); 
</script>
</body>
</html>
